name: Deploy to Cloudflare

on:
  push:
    branches: [release]
    paths:
      - "src/**"
      - "cloudflare/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: cp .env.example .env && php artisan key:generate

      - run: npm ci

      - name: Run tests
        run: php artisan test

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    env:
      APP_KEY: ${{ secrets.APP_KEY }}
      CALENDAR_ICAL_URL: ${{ secrets.CALENDAR_ICAL_URL }}
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - run: npm ci

      - name: Deploy Worker and container
        run: |
          # Upload secrets with the version so there is a single rollout instead of one per secret.
          jq -n '{APP_KEY: env.APP_KEY, CALENDAR_ICAL_URL: env.CALENDAR_ICAL_URL} | with_entries(select(.value != null and .value != ""))' > "$RUNNER_TEMP/secrets.json"
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json"
          rm -f "$RUNNER_TEMP/secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Warm up container
        if: ${{ vars.WORKER_URL != '' }}
        continue-on-error: true
        run: curl --fail --silent --show-error --retry 10 --retry-delay 15 --retry-all-errors --max-time 120 "${{ vars.WORKER_URL }}/up" > /dev/null
